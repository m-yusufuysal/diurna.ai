name: security
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: "17 3 * * 1" }]
permissions: { contents: read }
concurrency: { group: "security-${{ github.ref }}", cancel-in-progress: true }

jobs:
  gitleaks:                      # tüm geçmişi tara
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner --exit-code 1

  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --omit=dev
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'

  codeql:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript, queries: security-extended }
      - uses: github/codeql-action/analyze@v3

  semgrep:
    runs-on: ubuntu-latest
    container: { image: semgrep/semgrep:latest }
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --error --config p/javascript --config p/nodejs --config p/secrets --config p/owasp-top-ten --exclude docs --exclude node_modules

  tests:                         # selftest + kiracılar arası / rol kapısı testleri (boş geçici veriyle, STRICT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: security-tests (cross-tenant, role gates, SSRF, headers)
        env: { UM_TEST_STRICT: "1", UM_TEST_BASE: "http://127.0.0.1:3199" }
        run: |
          export UM_DATA_DIR="$(mktemp -d)" UM_CACHE_DIR="$(mktemp -d)" PORT=3199 HOST=127.0.0.1 UM_PLATFORM_PASSWORD="$(openssl rand -base64 24)Aa1#"
          node server.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3199/api/public/status >/dev/null && break; sleep 1; done
          node scripts/security-tests.js
      - if: always()
        run: tail -40 server.log || true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t diurna:ci .
      - name: non-root + trivy
        run: |
          test "$(docker run --rm --entrypoint id diurna:ci -u)" != "0"
      - uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: diurna:ci, severity: "HIGH,CRITICAL", exit-code: "1", ignore-unfixed: true }
